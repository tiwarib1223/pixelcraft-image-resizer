name: Bootstrap project

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Project zip link (paste the link from WhatsApp). Leave empty only if you uploaded a zip file to the repository instead."
        required: false
        default: ""
      sha256:
        description: "sha256 check code for the zip (optional - paste it if you were given one)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the project zip from the pasted link
        if: ${{ inputs.zip_url != '' }}
        run: |
          set -e
          echo "=== Downloading project zip from the pasted link ==="
          curl -fL --retry 3 -o project.zip "${{ inputs.zip_url }}"
          if [ -n "${{ inputs.sha256 }}" ]; then
            echo "${{ inputs.sha256 }}  project.zip" | sha256sum -c -
          fi
          unzip -tq project.zip > /dev/null
          echo "=== Download OK ==="

      - name: Find and unpack the project zip
        run: |
          set -e
          shopt -s nullglob
          ZIPS=( *.zip )
          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "ERROR: No zip to unpack. Run this workflow again and paste the zip link into the 'zip_url' box (or upload a zip file to the repository root)."
            exit 1
          fi
          ZIP="${ZIPS[0]}"
          echo "=== Found archive: $ZIP - contents: ==="
          unzip -l "$ZIP"
          rm -rf unpacked
          unzip -o -q "$ZIP" -d unpacked
          echo "=== Unpacked OK ==="

      - name: Locate the project folder and copy it to the root
        run: |
          set -e
          GRADLE_FILE=$(find unpacked -name settings.gradle.kts | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: No settings.gradle.kts found inside the zip. The archive layout was:"
            find unpacked | head -50
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Project folder inside zip: $PROJECT_DIR"
          cp -r "$PROJECT_DIR/." .
          rm -rf unpacked
          rm -f ./*.zip
          echo "=== Repository root after import ==="
          ls -la

      - name: Commit and push project files (never touches .github)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github'
          git commit -m "Import PixelCraft Stage 1 project files (bootstrap)" || echo "Nothing to commit."
          git push origin main

      - name: Start the Android build workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run android-build.yml --ref main && echo "Android build started" || echo "Start it manually: Actions > Android build > Run workflow."
